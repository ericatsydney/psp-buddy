[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psp-buddy"
version = "0.1.0"
description = "Protected local tactical automation scaffolding for PPSSPP"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<18", "Pillow>=12.3,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/scenarios"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: explicitly enabled protected emulator checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
